name: Actualizar Precios TCG Diario

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 6:00 AM UTC (puedes ajustarlo a tu hora)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite correrlo manualmente desde GitHub cuando quieras probarlo

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install gspread oauth2client requests

      - name: Ejecutar script de actualización
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python actualizar_tcg.py
